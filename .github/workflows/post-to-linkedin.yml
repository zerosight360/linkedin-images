name: Post to LinkedIn via Buffer

on:
  schedule:
    # Week 2 Company Posts - Aug 11-15, 2026 @ 9:00 AM IST (3:30 UTC)
    - cron: '30 3 11 8 *'  # Aug 11 - Cloud Misconfig
    - cron: '30 3 12 8 *'  # Aug 12 - API Security
    - cron: '30 3 13 8 *'  # Aug 13 - Supply Chain
    - cron: '30 3 14 8 *'  # Aug 14 - Zero-Day
    - cron: '30 3 15 8 *'  # Aug 15 - Identity Security
    
    # Week 2 Personal Posts - Aug 11-15, 2026 @ 9:30 AM IST (4:00 UTC)
    - cron: '0 4 11 8 *'   # Aug 11 - S3 Story
    - cron: '0 4 12 8 *'   # Aug 12 - AI Phishing
    - cron: '0 4 13 8 *'   # Aug 13 - NPM Dependency
    - cron: '0 4 14 8 *'   # Aug 14 - Zero-Day Response
    - cron: '0 4 15 8 *'   # Aug 15 - AI Code Security
  
  workflow_dispatch:
    inputs:
      post_id:
        description: 'Post ID to publish (e.g., company_1, personal_3)'
        required: true
        type: string
      force:
        description: 'Force post even if already posted'
        required: false
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Determine which post to publish
        id: determine_post
        run: |
          if [ -n "${{ github.event.inputs.post_id }}" ]; then
            POST_ID="${{ github.event.inputs.post_id }}"
          else
            # Determine based on cron schedule (date and time)
            DAY=$(date -u +%d)
            HOUR=$(date -u +%H)
            
            # Map day to post number (11->1, 12->2, etc.)
            POST_NUM=$((DAY - 10))
            
            # Determine channel based on time (3:30 = company, 4:00 = personal)
            if [ "$HOUR" -eq 3 ]; then
              POST_ID="company_${POST_NUM}"
            else
              POST_ID="personal_${POST_NUM}"
            fi
          fi
          
          echo "post_id=${POST_ID}" >> $GITHUB_OUTPUT
          echo "📝 Post ID: ${POST_ID}"
      
      - name: Check if already posted
        id: check_posted
        run: |
          POST_ID="${{ steps.determine_post.outputs.post_id }}"
          POSTED_FILE="posted/${POST_ID}.done"
          
          if [ -f "$POSTED_FILE" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "⚠️ Post ${POST_ID} was already published on $(cat $POSTED_FILE)"
            echo "   Use force=true to post again"
            echo "already_posted=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Post ${POST_ID} has not been published yet"
            echo "already_posted=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Post to Buffer
        if: steps.check_posted.outputs.already_posted == 'false'
        id: post_buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          POST_ID="${{ steps.determine_post.outputs.post_id }}"
          
          # Load post data from JSON file
          POST_DATA=$(cat posts/posts.json | jq -r ".posts[] | select(.id == \"${POST_ID}\")")
          
          if [ -z "$POST_DATA" ] || [ "$POST_DATA" == "null" ]; then
            echo "❌ Error: Post ${POST_ID} not found in posts.json"
            exit 1
          fi
          
          CHANNEL_ID=$(echo "$POST_DATA" | jq -r '.channel_id')
          TEXT=$(echo "$POST_DATA" | jq -r '.text')
          IMAGE=$(echo "$POST_DATA" | jq -r '.image')
          TOPIC=$(echo "$POST_DATA" | jq -r '.topic')
          
          # Use blob URL with raw=true (reliable, no CDN caching issues)
          IMAGE_URL="https://github.com/zerosight360/linkedin-images/blob/master/${IMAGE}?raw=true"
          
          echo "📌 Topic: $TOPIC"
          echo "📷 Image: $IMAGE_URL"
          echo "📝 Text preview: ${TEXT:0:100}..."
          
          # Post to Buffer using shareNow (immediate publish)
          RESPONSE=$(curl -s -X POST https://api.buffer.com/graphql \
            -H "Authorization: Bearer ${BUFFER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"query\": \"mutation CreatePost(\$input: CreatePostInput!) { createPost(input: \$input) { ... on PostActionSuccess { post { id status } } ... on MutationError { message } } }\",
              \"variables\": {
                \"input\": {
                  \"channelId\": \"${CHANNEL_ID}\",
                  \"text\": $(echo "$TEXT" | jq -Rs .),
                  \"mode\": \"shareNow\",
                  \"schedulingType\": \"automatic\",
                  \"assets\": [{\"image\": {\"url\": \"${IMAGE_URL}\"}}]
                }
              }
            }")
          
          echo "📡 Buffer API Response:"
          echo "$RESPONSE" | jq .
          
          # Check for errors
          if echo "$RESPONSE" | jq -e '.errors' > /dev/null 2>&1; then
            echo "❌ Error posting to Buffer"
            exit 1
          fi
          
          if echo "$RESPONSE" | jq -e '.data.createPost.message' > /dev/null 2>&1; then
            ERROR_MSG=$(echo "$RESPONSE" | jq -r '.data.createPost.message')
            echo "❌ Buffer error: $ERROR_MSG"
            exit 1
          fi
          
          # Extract post ID from response
          BUFFER_POST_ID=$(echo "$RESPONSE" | jq -r '.data.createPost.post.id // empty')
          echo "buffer_post_id=${BUFFER_POST_ID}" >> $GITHUB_OUTPUT
          echo "✅ Successfully posted! Buffer Post ID: ${BUFFER_POST_ID}"
      
      - name: Mark as posted
        if: steps.check_posted.outputs.already_posted == 'false' && steps.post_buffer.outcome == 'success'
        run: |
          POST_ID="${{ steps.determine_post.outputs.post_id }}"
          mkdir -p posted
          
          # Record when it was posted
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" > "posted/${POST_ID}.done"
          echo "Buffer Post ID: ${{ steps.post_buffer.outputs.buffer_post_id }}" >> "posted/${POST_ID}.done"
          
          # Commit the change
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add posted/
          git commit -m "✅ Posted: ${POST_ID} at $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
          
          echo "📝 Marked ${POST_ID} as posted"
      
      - name: Summary
        run: |
          POST_ID="${{ steps.determine_post.outputs.post_id }}"
          
          echo "## 📊 Post Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Post ID | \`${POST_ID}\` |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check_posted.outputs.already_posted }}" == "true" ]; then
            echo "| Status | ⚠️ Already posted (skipped) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Status | ✅ Posted successfully |" >> $GITHUB_STEP_SUMMARY
            echo "| Buffer Post ID | \`${{ steps.post_buffer.outputs.buffer_post_id }}\` |" >> $GITHUB_STEP_SUMMARY
          fi
